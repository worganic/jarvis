<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Jarvis — onglets</title>
  <style>
    body { font: 13px/1.5 'Segoe UI', sans-serif; background: #04121c; color: #d8f6ff; margin: 0; padding: 16px; min-width: 300px; }
    h1 { font-size: 14px; letter-spacing: 2px; color: #38e1ff; margin: 0 0 10px; }
    .state { padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(56, 225, 255, 0.4); margin-bottom: 12px; }
    .state.off { border-color: rgba(255, 92, 112, 0.6); color: #ffb3bc; }
    label { display: block; font-size: 11px; color: #8fbfd0; margin-bottom: 4px; }
    input { width: 90px; background: #021018; border: 1px solid rgba(56, 225, 255, 0.4); color: #e4f8ff; padding: 4px 6px; border-radius: 4px; }
    button { background: rgba(56, 225, 255, 0.15); border: 1px solid rgba(56, 225, 255, 0.6); color: #d8f6ff; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-left: 6px; }
    p { color: #8fbfd0; font-size: 11.5px; }
  </style>
</head>
<body>
  <h1>JARVIS — ONGLETS</h1>
  <div id="state" class="state">…</div>
  <label for="port">Port de Jarvis (127.0.0.1)</label>
  <input id="port" type="number" min="1024" max="65535"> <button id="save">Enregistrer</button> <button id="retry">Reconnecter</button>
  <p>Jarvis voit tes onglets (sauf navigation privée) et peut aller sur un onglet, le fermer, en ouvrir un, lire ou cliquer dans une page à ta demande. Rien ne quitte ce PC.</p>
  <script src="options.js"></script>
</body>
</html>
