[package]
name = "jarvis-core"
version.workspace = true
edition.workspace = true
description = "Jarvis v4 - noyau : orchestrateur, passerelle des fenêtres, liaison voix, sécurité, connecteurs"

[features]
default = ["semantic"]
# Mémoire sémantique (embeddings EmbeddingGemma ONNX) : ort + tokenizers.
semantic = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
regex.workspace = true
fancy-regex.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
notify.workspace = true
anyhow.workspace = true
getrandom.workspace = true
windows.workspace = true
jarvis-native.workspace = true
urlencoding = "2"
sha1_smol = { version = "1", features = ["std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Archive de transfert des données (.jarvis) : secrets rechiffrés par un mot de passe.
argon2 = "0.5"
chacha20poly1305 = "0.10"
# Jarvis Réseau : envois chiffrés de bout en bout entre Jarvis (boîte NaCl : X25519 + XSalsa20-Poly1305).
crypto_box = { version = "0.9", features = ["std"] }
pdf-extract = "0.7"
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
encoding_rs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
# Compétences à déposer (skills/*.js) : moteur JavaScript embarqué, 100 % Rust.
boa_engine = "0.20"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml", "half", "api-24"], optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.16", optional = true }
