<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS · Historique des versions</title>
  <style>
    :root {
      --bg: #00040a;
      --panel: rgba(3, 18, 26, 0.7);
      --cyan: #38e1ff;
      --cyan-dim: rgba(56, 225, 255, 0.3);
      --text: #cdeaf2;
      --muted: rgba(180, 225, 240, 0.55);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Consolas, "Courier New", monospace; }
    body { min-height: 100vh; background: radial-gradient(ellipse at 50% -10%, rgba(56, 225, 255, 0.1), transparent 60%), var(--bg); }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }
    header h1 { margin: 0; font-size: 22px; letter-spacing: 0.35em; color: var(--cyan); font-weight: 600; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    #current { color: var(--cyan); }

    .toolbar { position: sticky; top: 0; z-index: 5; margin: 22px -16px 0; padding: 12px 16px; background: rgba(0, 4, 10, 0.92); border-bottom: 1px solid var(--cyan-dim); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { --c: var(--cyan); font: inherit; font-size: 12px; letter-spacing: 0.05em; color: var(--text); background: transparent; border: 1px solid var(--c); border-radius: 999px; padding: 4px 12px; cursor: pointer; opacity: 0.55; transition: opacity 0.15s, background 0.15s; }
    .chip:hover { opacity: 0.9; }
    .chip.on { opacity: 1; background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 30%, transparent); }
    .chip .n { opacity: 0.6; margin-left: 4px; }
    .chip:focus-visible, #q:focus-visible, .reset:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .row2 { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    #q { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--cyan-dim); border-radius: 4px; padding: 6px 10px; }
    .reset { font: inherit; font-size: 12px; color: var(--cyan); background: transparent; border: 0; cursor: pointer; text-decoration: underline; padding: 4px; }
    #count { color: var(--muted); font-size: 12px; }

    .version { margin-top: 28px; padding-left: 18px; border-left: 2px solid var(--cyan-dim); position: relative; }
    .version::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
    .vhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
    .vnum { font-size: 20px; color: var(--cyan); font-weight: 600; }
    .vtag { font-size: 11px; letter-spacing: 0.12em; color: #00040a; background: var(--cyan); padding: 1px 8px; border-radius: 3px; }
    .vtitle { font-size: 14px; color: var(--text); }
    .vdate { margin-left: auto; font-size: 12px; color: var(--muted); }
    ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
    li { display: flex; gap: 10px; align-items: baseline; background: var(--panel); border: 1px solid rgba(56, 225, 255, 0.12); border-radius: 4px; padding: 8px 12px; font-size: 13px; line-height: 1.5; }
    .tag { --c: var(--cyan); flex: none; min-width: 7.5em; text-align: center; font-size: 11px; letter-spacing: 0.04em; color: var(--c); border: 1px solid var(--c); border-radius: 3px; padding: 0 6px; }
    .empty { margin-top: 40px; color: var(--muted); text-align: center; }
    mark { background: rgba(56, 225, 255, 0.28); color: inherit; }
    @media (max-width: 560px) { li { flex-direction: column; gap: 4px; } .tag { min-width: 0; align-self: flex-start; } .vdate { margin-left: 0; width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>J.A.R.V.I.S.</h1>
      <p>Historique des versions — du plus récent au plus ancien. Version actuelle : <span id="current">…</span></p>
    </header>

    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Filtrer par thème"></div>
      <div class="row2">
        <input id="q" type="search" placeholder="Rechercher dans l'historique…" aria-label="Rechercher">
        <button class="reset" id="reset" type="button" hidden>Tout afficher</button>
        <span id="count" aria-live="polite"></span>
      </div>
    </div>

    <div id="list"></div>
  </main>

  <script>
  (function () {
    const chipsEl = document.getElementById('chips');
    const listEl = document.getElementById('list');
    const qEl = document.getElementById('q');
    const resetEl = document.getElementById('reset');
    const countEl = document.getElementById('count');
    let data = null;
    const selected = new Set(); // thèmes actifs ; vide = tous

    function fromHash() {
      const m = /themes=([^&]*)/.exec(location.hash);
      if (m) decodeURIComponent(m[1]).split(',').filter(Boolean).forEach((t) => selected.add(t));
    }
    function toHash() {
      const h = selected.size ? '#themes=' + encodeURIComponent([...selected].join(',')) : '';
      history.replaceState(null, '', location.pathname + location.search + h);
    }

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function highlight(parent, text, q) {
      const i = q ? text.toLowerCase().indexOf(q) : -1;
      if (i < 0) { parent.textContent = text; return; }
      parent.append(text.slice(0, i));
      parent.append(el('mark', '', text.slice(i, i + q.length)));
      parent.append(text.slice(i + q.length));
    }
    function dateFr(iso) {
      const d = new Date(iso + 'T12:00:00');
      return isNaN(d) ? iso : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    function color(theme) {
      return (data.themes[theme] && data.themes[theme].color) || '#38e1ff';
    }
    function label(theme) {
      return (data.themes[theme] && data.themes[theme].label) || theme;
    }

    function buildChips() {
      const counts = {};
      data.versions.forEach((v) => v.changes.forEach((c) => { counts[c.theme] = (counts[c.theme] || 0) + 1; }));
      chipsEl.replaceChildren();
      Object.keys(data.themes).filter((t) => counts[t]).forEach((t) => {
        const b = el('button', 'chip');
        b.type = 'button';
        b.dataset.theme = t;
        b.style.setProperty('--c', color(t));
        b.append(label(t), el('span', 'n', String(counts[t])));
        b.addEventListener('click', () => {
          if (selected.has(t)) selected.delete(t); else selected.add(t);
          toHash();
          render();
        });
        chipsEl.append(b);
      });
    }

    function render() {
      const q = qEl.value.trim().toLowerCase();
      let shown = 0;
      listEl.replaceChildren();
      data.versions.forEach((v, idx) => {
        const rows = v.changes.filter((c) => (!selected.size || selected.has(c.theme)) && (!q || c.text.toLowerCase().includes(q) || label(c.theme).toLowerCase().includes(q) || (v.title || '').toLowerCase().includes(q)));
        if (!rows.length) return;
        shown += rows.length;
        const box = el('section', 'version');
        const head = el('div', 'vhead');
        head.append(el('span', 'vnum', 'v' + v.version));
        if (idx === 0) head.append(el('span', 'vtag', 'ACTUELLE'));
        if (v.title) head.append(el('span', 'vtitle', v.title));
        head.append(el('span', 'vdate', dateFr(v.date)));
        const ul = el('ul');
        rows.forEach((c) => {
          const li = el('li');
          const tag = el('span', 'tag', label(c.theme));
          tag.style.setProperty('--c', color(c.theme));
          const txt = el('span');
          highlight(txt, c.text, q);
          li.append(tag, txt);
          ul.append(li);
        });
        box.append(head, ul);
        listEl.append(box);
      });
      if (!shown) listEl.append(el('p', 'empty', 'Aucune modification ne correspond à ces filtres.'));
      chipsEl.querySelectorAll('.chip').forEach((b) => b.classList.toggle('on', selected.has(b.dataset.theme)));
      resetEl.hidden = !selected.size && !q;
      countEl.textContent = `${shown} modification${shown > 1 ? 's' : ''}`;
    }

    qEl.addEventListener('input', render);
    resetEl.addEventListener('click', () => { selected.clear(); qEl.value = ''; toHash(); render(); });
    window.addEventListener('hashchange', () => { selected.clear(); fromHash(); render(); });

    fetch('changelog.json', { cache: 'no-store' })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((d) => {
        data = d;
        document.getElementById('current').textContent = d.versions.length ? 'v' + d.versions[0].version : '—';
        fromHash();
        buildChips();
        render();
      })
      .catch((e) => { listEl.replaceChildren(el('p', 'empty', 'Impossible de charger l\'historique (' + e.message + ').')); });
  })();
  </script>
</body>
</html>
